[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "errand-agents"
version = "0.1.0"
description = "Search-guided vs. sequential tool agents for multi-errand planning under tool failures"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Maria Jose Rios" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
